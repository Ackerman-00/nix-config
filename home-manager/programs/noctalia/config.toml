[osd]
background_opacity = 0.54999998770654202
offset_x = 10
orientation = "vertical"
position_vertical = "center_right"
scale = 0.7500000037252903

[plugins]
enabled = [ "dotnetrob/cat", "noctalia/bongocat", "noctalia/screen_recorder" ]

[shell]
app_icon_colorize = true
avatar_path = "/home/ackerman/Pictures/Pfp/2.jpg"
font_family = "Annotation Mono"
password_style = "random"
polkit_agent = true
settings_window_translucent = true

    [shell.panel]
    clipboard_position = "bottom_center"
    control_center_placement = "floating"
    launcher_position = "bottom_center"
    polkit_position = "bottom_center"
    session_placement = "floating"
    session_position = "center_right"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "bottom_center"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/ackerman/Pictures/Screenshots"

    [shell.session]
    grid = true
    grid_columns = 1

[theme]
community_palette = "Monochrome"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kitty", "qt", "starship", "umbriel" ]
    community_ids = [ "opencode", "discord", "zed", "fastfetch", "papirus-icons" ]
    enable_builtin_templates = true

[wallpaper]
directory = "/home/ackerman/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/ackerman/Pictures/wallpapers/wallhaven-8gdpgo.png"

    [wallpaper.last]
    path = "/home/ackerman/Pictures/wallpapers/wallhaven-8gdpgo.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/ackerman/Pictures/wallpapers/wallhaven-8gdpgo.png"

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.cat_2]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.cpu]
show_value = false

[widget.ram]
show_value = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.temp]
show_value = false

[widget.tray]
drawer = true

[widget.workspaces]
show_labels = false
