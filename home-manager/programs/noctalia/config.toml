[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.4999999888241291
capsule = true
capsule_radius = 7
center = [ "recorder", "workspaces", "cat" ]
end = [ "tray", "notifications", "volume", "clock", "cat_2" ]
font_scale = 0.89999998733401299
margin_ends = 0
position = "left"
